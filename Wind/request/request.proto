syntax = "proto3";

package request;

import "v1/market.proto";

enum RequestType {
    reserved 2, 4, 5, 7;
    reserved "QUERY_AUTH", "UPDATE_AUTH", "QUERY_USERINFO", "STRATEGY", "HQMARKET", "ACCOUNT";
    UNKNOWN = 0;
    AUTH_LOGIN = 1;
    AUTH_REGISTER = 3;
    HEARTBEAT = 6;
    TRADE_ACCOUNT_LOGIN = 8;
    TRADE_ACCOUNT_QUERY = 9;
    TRADE_ACCOUNT_ADD = 10;
    TRADE_ACCOUNT_MODIFY = 11;
    TRADE_ACCOUNT_CONNECT = 12;
    TRADE_ACCOUNT_DISCONNECT = 13;
    TRADE_ACCOUNT_INFO_QUERY = 14;
    TRADE_ACCOUNT_LOGS_QUERY = 15;
    STRATEGY_ADD = 20;
    STRATEGY_MODIFY = 21;
    STRATEGY_QUERY = 22;
    STRATEGY_DELETE = 23;
    STRATEGY_RUNTIME_QUERY = 24;
    STRATEGY_START = 25;
    STRATEGY_PAUSE = 26;
    STRATEGY_STOP = 27;
    MARKET_SUBSCRIBE = 40;
    MARKET_UNSUBSCRIBE = 41;
    MARKET_QUOTE_QUERY = 42;
    MARKET_BARS_QUERY = 43;
    MARKET_SECURITIES_QUERY = 44;
    MARKET_SECTORS_QUERY = 45;
    MARKET_SECTOR_CONSTITUENTS_QUERY = 46;
    MARKET_QUOTE_PUSH = 47;
    MARKET_DEPTH_PUSH = 48;
}

message StrategySubscription {
    string security = 1;
    string exchange = 2;
    string channel = 3;
}

message StrategyInfo {
    uint64 strategy_id = 1;
    string strategy_type = 2;
    string strategy_name = 3;
    map<string, string> parameters = 4;
    repeated StrategySubscription subscriptions = 5;
    uint32 event_queue_limit = 6;
    bool auto_start = 7;
    bool enabled = 8;
    uint64 account_id = 9;
}

message StrategyList {
    repeated StrategyInfo strategies = 1;
}


enum TradingAccountType { ACCOUNT_SIMULATED = 0; ACCOUNT_PRODUCTION = 1; }
enum TradingAccountState { ACCOUNT_DISCONNECTED = 0; ACCOUNT_CONNECTED = 1; ACCOUNT_ERROR = 2; }
// Account display/response data only; login credentials belong in RequestData.extra.
message TradeAccountRecord {
 uint64 account_id = 1;
 string name = 2;
 TradingAccountType account_type = 3;
 int64 initial_balance = 4; // Money is integer cents, independent of quote price scale.
 TradingAccountState state = 5;
 string number = 6;
 uint32 strategy_count = 7;
 string last_error = 8;
 string created_at = 9;
 string updated_at = 10;
 bool is_default = 11;
}
message TradeAccountList { repeated TradeAccountRecord accounts = 1; }
message TradeAccountInfo {
 uint64 account_id = 1;
 int64 balance = 2;
 int64 available = 3;
 int64 frozen = 4;
 bool available_snapshot = 5;
 int64 server_time_ms = 6;
 int32 error_code = 7;
 string error_message = 8;
}
message TradeAccountInfoList { repeated TradeAccountInfo accounts = 1; }
message TradeAccountLog {
 string time = 1;
 string actor = 2;
 string action = 3;
 string message = 4;
}
message TradeAccountLogList { uint64 account_id = 1; repeated TradeAccountLog logs = 2; }

message StrategyRuntimeRecord {
 uint64 strategy_id = 1;
 int32 state = 2;
 bool market_available = 3;
 uint64 queue_length = 4;
 uint64 active_orders = 5;
 string last_error = 6;
}
message StrategyRuntimeList { repeated StrategyRuntimeRecord runtimes = 1; }

message RequestData {
	reserved 24, 26, 28;
	reserved "security_list_request";
	reserved "security_list_response";
	reserved "sector_list_request";
	reserved "sector_constituents_request";
	RequestType type = 1;
    reserved 2, 4, 10, 11, 12, 20, 32;
    reserved "cmd", "ret", "auth_request", "subscribe_request", "unsubscribe_request", "query_request", "account_snapshot";
    map<string, string> extra = 3;

	uint64 id = 5;
	int32 error_code = 6;
	string error_message = 7;
	oneof payload {
		hqmarket.market.v1.SubscriptionAck subscription_ack = 13;
		hqmarket.market.v1.QuoteData quote = 14;
		hqmarket.market.v1.DepthData depth = 15;
		hqmarket.market.v1.TradeData trade = 16;
		hqmarket.market.v1.BarData bar = 17;
		hqmarket.market.v1.MarketStatusData market_status = 18;
		hqmarket.market.v1.ProviderStatusData provider_status = 19;
		hqmarket.market.v1.QueryResponse query_response = 21;
		StrategyInfo strategy = 22;
		StrategyList strategy_list = 23;
		hqmarket.market.v1.SecurityList security_list = 25;
		hqmarket.market.v1.SectorList sector_list = 27;
		hqmarket.market.v1.SectorConstituents sector_constituents = 29;
        TradeAccountRecord account = 30;
        TradeAccountList account_list = 31;
        TradeAccountLogList account_logs = 33;
        TradeAccountInfoList account_info_list = 34;
        StrategyRuntimeList strategy_runtime_list = 35;
	}
}
